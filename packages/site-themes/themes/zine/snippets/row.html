<article class="zn-row{% if post.image and s.show_images %} zn-row--image{% endif %}">
  {% if post.image and s.show_images %}
  <div class="zn-row__image">{{ post.image | image: '120px' }}</div>
  {% endif %}
  <div class="zn-row__body">
    <h3 class="zn-row__title"><a href="{{ post.url }}">{{ post.title }}</a></h3>
    {% if s.show_excerpt and post.excerpt %}
    <p class="zn-row__excerpt">{{ post.excerpt | truncatewords: 26 }}</p>
    {% endif %}
  </div>
  <p class="zn-row__meta">
    <time datetime="{{ post.date | date: 'iso' }}">{{ post.date | date: 'short' }}</time>
    {% if post.is_paid %}<span class="zn-badge">Paid</span>{% endif %}
  </p>
</article>
