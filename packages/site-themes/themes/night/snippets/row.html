<article class="nt-row{% if post.image and s.show_images %} nt-row--image{% endif %}">
  {% if post.image and s.show_images %}
  <div class="nt-row__image">{{ post.image | image: '160px' }}</div>
  {% endif %}
  <div class="nt-row__body">
    <h3 class="nt-row__title"><a href="{{ post.url }}">{{ post.title }}</a></h3>
    {% if s.show_excerpt and post.excerpt %}
    <p class="nt-row__excerpt">{{ post.excerpt | truncatewords: 28 }}</p>
    {% endif %}
  </div>
  <p class="nt-row__meta">
    <time datetime="{{ post.date | date: 'iso' }}">{{ post.date | date: 'short' }}</time>
    {% if post.is_paid %}<span class="nt-badge">Paid</span>{% endif %}
  </p>
</article>
