<article class="letter-row{% if post.image and s.show_images %} letter-row--image{% endif %}">
  <p class="letter-row__date">
    <time datetime="{{ post.date | date: 'iso' }}">{{ post.date | date: 'long' }}</time>
  </p>
  <div class="letter-row__body">
    <h3 class="letter-row__title"><a href="{{ post.url }}">{{ post.title }}</a></h3>
    {% if s.show_excerpt and post.excerpt %}
    <p class="letter-row__excerpt">{{ post.excerpt | truncatewords: 46 }}</p>
    {% endif %} {% if post.is_paid %}
    <p class="letter-row__paid">For paid subscribers</p>
    {% endif %}
  </div>
  {% if post.image and s.show_images %}
  <div class="letter-row__image">{{ post.image | image: '160px' }}</div>
  {% endif %}
</article>
