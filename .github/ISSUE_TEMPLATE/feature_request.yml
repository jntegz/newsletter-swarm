name: Feature request
description: Suggest something Swarm should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, and how you handle it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
